[package]
name = "quire-semantic-value"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "The shared no_std semantic-value leaf: runtime semantic values over the quire-exact kernel."
authors = ["Agent IX <peter@agent-ix.ai>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-semantic-value"
publish = false

[lib]
name = "quire_semantic_value"
path = "src/lib.rs"

[dependencies]
quire-exact = { git = "https://github.com/agent-ix/quire-exact", branch = "main" }
# The one RFC 8785 encoder, without `std`, for bounded measurement of
# structural compound-unit terms.
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", branch = "main", default-features = false }
thiserror = { version = "2.0.20", default-features = false }

[features]
# The test-only reservation permit of `SuppliedRun`. Only a `[dev-dependencies]`
# entry enables it.
test-support = []

[dev-dependencies]
allocation-counter = "0.8"
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# `seam_probe` is a consumer-set `--cfg` (QSL FR-063); `WrongSnapshotCause`
# carries its probe variant.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(seam_probe)"] }

[lints.clippy]
all = "deny"
