[package]
name = "quire-semantic-value"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "The shared no_std semantic-value leaf: runtime semantic values over the quire-exact kernel."
authors = ["Agent IX <peter@agent-ix.ai>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-semantic-value"
publish = false

[lib]
name = "quire_semantic_value"
path = "src/lib.rs"

[dependencies]
quire-exact = { git = "https://github.com/agent-ix/quire-exact", branch = "main" }
# The one RFC 8785 encoder, without `std`, for the
# `quire.value.compound-unit/v1` id.
quire-canonical = { git = "https://github.com/agent-ix/quire-canonical", branch = "main", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0.20", default-features = false }

[dev-dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
