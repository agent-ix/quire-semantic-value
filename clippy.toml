msrv = "1.98"
cognitive-complexity-threshold = 30
too-many-arguments-threshold = 8

# This crate carries `NodeKey`, `EffectiveId` and `PopulationId` from its caller.
# Only the caller's checking and model stages construct them (FR-060-AC-5/6).
disallowed-methods = [
    { path = "quire_exact::NodeKey::new", reason = "only the checking stage constructs a NodeKey" },
    { path = "quire_exact::EffectiveId::new", reason = "only the model stage constructs an EffectiveId" },
    { path = "quire_exact::PopulationId::new", reason = "only the model stage constructs a PopulationId" },
]
